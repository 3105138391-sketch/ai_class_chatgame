<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 文字游戏生成器</title>
<style>
:root {
  --pip:#4ec9b0; --pip-rgb:78,201,176; --pip-soft:#c9fff0; --pip-soft-rgb:201,255,240;
  --danger:#e06c75; --scene-bg:none;
}
* { margin:0; padding:0; box-sizing:border-box }
html { height:100%; overflow:hidden }
body {
  width:100vw; height:100vh; min-height:100dvh; overflow:hidden; position:relative;
  background:#080b0a; color:var(--pip); font-family:"Courier New","PingFang SC",monospace;
  font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%; touch-action:manipulation;
}
body::before {
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(90deg, rgba(0,0,0,.82), rgba(0,0,0,.50) 48%, rgba(0,0,0,.84)),
    radial-gradient(circle at 15% 8%, rgba(var(--pip-rgb),.20), transparent 30%),
    radial-gradient(circle at 80% 70%, rgba(119,88,36,.22), transparent 34%),
    var(--scene-bg);
  background-size:cover; background-position:center; transform:scale(1.02);
  filter:saturate(.92) contrast(.96); transition:background-image .85s ease, filter .85s ease;
}
body::after {
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(circle at 50% 18%, rgba(var(--pip-rgb),.14), transparent 32%),
    linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.68));
}
.crt {
  position:fixed; inset:0; z-index:1000; pointer-events:none;
  background:linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,.25) 50%),
    linear-gradient(90deg, rgba(255,0,0,.04), rgba(0,255,0,.015), rgba(0,0,255,.04));
  background-size:100% 2px, 3px 100%;
}
.scanline {
  position:fixed; width:100%; height:100px; z-index:1001; pointer-events:none;
  background:linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(var(--pip-rgb),.04) 50%, rgba(0,0,0,0) 100%);
  opacity:.08; animation:scan 8s linear infinite;
}
@keyframes scan { 0%{bottom:100%} 100%{bottom:-100px} }
#app {
  position:relative; z-index:1; width:100%; height:100vh; min-height:100dvh; display:flex;
  max-width:980px; margin:0 auto; padding:20px 24px;
}
#main {
  flex:1; min-width:0; display:flex; flex-direction:column; padding:0 16px;
  background:linear-gradient(180deg, rgba(2,10,9,.80), rgba(2,8,8,.68));
  border:1px solid rgba(var(--pip-rgb),.18); border-radius:8px;
  box-shadow:0 20px 80px rgba(0,0,0,.42); backdrop-filter:blur(10px);
}
header {
  position:relative; text-align:center; padding:12px 0; border-bottom:1px solid rgba(var(--pip-rgb),.25);
  margin-bottom:12px; flex-shrink:0;
}
header h1 { font-size:20px; letter-spacing:4px; font-weight:400; text-shadow:0 0 8px rgba(var(--pip-rgb),.5) }
header p { font-size:10px; opacity:.62; margin-top:2px; letter-spacing:2px }
.header-actions { position:absolute; right:0; top:10px; display:flex; gap:8px }
#end-run,#audio-toggle {
  background:rgba(0,0,0,.24); border:1px solid rgba(var(--pip-rgb),.34); color:var(--pip);
  padding:6px 10px; border-radius:4px; font-family:inherit; font-size:12px;
  cursor:pointer; letter-spacing:2px; transition:.2s;
}
#end-run:hover,#audio-toggle:hover,#audio-toggle.active { background:rgba(var(--pip-rgb),.1); border-color:var(--pip) }
.status-bar {
  display:flex; gap:14px; flex-wrap:wrap; padding:8px 0; font-size:12px;
  border-bottom:1px solid rgba(var(--pip-rgb),.15); margin-bottom:12px; opacity:.82; flex-shrink:0;
}
#output {
  flex:1; overflow-y:auto; padding:12px 0; scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
}
#output::-webkit-scrollbar { width:6px }
#output::-webkit-scrollbar-track { background:transparent }
#output::-webkit-scrollbar-thumb { background:rgba(var(--pip-rgb),.25); border-radius:3px }
.panel {
  border:1px solid rgba(var(--pip-rgb),.20); background:rgba(0,0,0,.24);
  border-radius:6px; padding:14px; margin-bottom:12px;
}
.panel h2 { font-size:15px; font-weight:400; letter-spacing:2px; margin-bottom:8px; color:var(--pip-soft) }
.panel p,.panel li { color:rgba(var(--pip-soft-rgb),.76); font-size:13px }
.preset-card {
  border:1px solid rgba(var(--pip-rgb),.34); border-radius:6px; padding:12px; margin-bottom:12px;
  background:linear-gradient(180deg, rgba(var(--pip-rgb),.08), rgba(0,0,0,.22));
  cursor:pointer; transition:.2s;
}
.preset-card.active,.preset-card:hover { border-color:var(--pip); background:rgba(var(--pip-rgb),.09) }
.preset-card strong { display:block; color:var(--pip-soft); font-weight:400; letter-spacing:2px; margin-bottom:4px }
.source-link { display:inline-block; margin-top:6px; color:rgba(var(--pip-soft-rgb),.52); font-size:12px; text-decoration:none }
.source-link:hover { color:var(--pip-soft) }
textarea,input {
  width:100%; background:transparent; border:1px solid rgba(var(--pip-rgb),.30);
  color:var(--pip-soft); border-radius:4px; font-family:inherit; outline:none;
}
textarea { min-height:132px; resize:vertical; padding:12px; line-height:1.65 }
textarea:focus,input:focus { border-color:var(--pip); box-shadow:0 0 8px rgba(var(--pip-rgb),.16) }
textarea::placeholder,input::placeholder { color:rgba(var(--pip-rgb),.30) }
.toolbar { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap }
.primary,.ghost,.identity-btn,.btn-opt {
  background:transparent; border:1px solid rgba(var(--pip-rgb),.34); color:var(--pip);
  border-radius:4px; font-family:inherit; cursor:pointer; transition:.2s;
}
.primary { border-color:var(--pip); padding:9px 16px; letter-spacing:2px; min-height:40px }
.ghost,.identity-btn { padding:8px 12px; min-height:38px }
.primary:hover,.ghost:hover,.identity-btn:hover,.btn-opt:hover { background:rgba(var(--pip-rgb),.08); border-color:var(--pip) }
.primary:disabled { opacity:.35; pointer-events:none }
.muted { color:rgba(var(--pip-soft-rgb),.46)!important }
.loading { color:rgba(var(--pip-rgb),.48); animation:blink 1s steps(1) infinite }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.identity-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:10px 0 }
.identity-btn { text-align:left; color:var(--pip-soft); min-height:54px }
.identity-btn small { display:block; color:rgba(var(--pip-soft-rgb),.54); margin-top:3px }
.msg { margin-bottom:14px; animation:fadeIn .4s ease; white-space:pre-wrap; word-break:break-word }
.msg.gm { color:var(--pip-soft); padding-left:8px; border-left:2px solid rgba(var(--pip-rgb),.3) }
.msg.player { color:var(--pip); opacity:.72; text-align:right; padding-right:8px; font-style:italic }
.msg.system { color:rgba(var(--pip-rgb),.58); font-size:12px; text-align:center }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg-image {
  width:min(100%,520px); aspect-ratio:16/9; margin-top:12px;
  border:1px solid rgba(var(--pip-rgb),.22); border-radius:6px;
  background:rgba(0,0,0,.32); overflow:hidden; display:flex;
  align-items:center; justify-content:center; white-space:normal;
}
.msg-image img { width:100%; height:100%; object-fit:cover; display:block }
.msg-image .placeholder { color:rgba(var(--pip-rgb),.35); font-size:12px; line-height:1.6; padding:16px; text-align:center }
#opts-area { display:flex; flex-direction:column; gap:6px; padding:8px 0; flex-shrink:0 }
.btn-opt { padding:8px 14px; font-size:13px; text-align:left; min-height:40px }
#input-area { display:flex; gap:8px; padding:10px 0; border-top:1px solid rgba(var(--pip-rgb),.25); flex-shrink:0; align-items:center }
#input { flex:1; min-width:0; padding:10px 14px; font-size:15px; caret-color:var(--pip) }
#send { background:transparent; border:1px solid var(--pip); color:var(--pip); padding:10px 20px; font-family:inherit; font-size:14px; cursor:pointer; border-radius:4px; transition:.2s; letter-spacing:2px; flex-shrink:0 }
#send:hover { background:rgba(var(--pip-rgb),.1); box-shadow:0 0 12px rgba(var(--pip-rgb),.25) }
#send:disabled,.btn-opt:disabled { opacity:.3; cursor:not-allowed; pointer-events:none }
.hidden { display:none!important }
.credits-overlay {
  position:fixed; inset:0; z-index:1200; display:none; overflow:hidden;
  background:radial-gradient(circle at 50% 10%, rgba(var(--pip-rgb),.2), transparent 32%), #020403;
  color:var(--pip-soft);
}
.credits-overlay.active { display:block }
.credits-roll {
  position:absolute; left:50%; width:min(760px,86vw); top:72%;
  transform:translateX(-50%); text-align:center; animation:creditsRoll 46s linear forwards;
  text-shadow:0 0 16px rgba(var(--pip-rgb),.42);
}
.credits-roll h2 { font-size:28px; letter-spacing:6px; font-weight:400; margin-bottom:12px }
.credits-roll h3 { font-size:15px; letter-spacing:4px; font-weight:400; margin:34px 0 12px; color:var(--pip) }
.credits-roll p { margin:8px 0; color:rgba(var(--pip-soft-rgb),.82) }
.credits-roll .big-stat { font-size:24px; color:var(--pip); margin:12px 0 }
.credits-actions { position:absolute; right:24px; bottom:20px; display:flex; gap:10px; z-index:2 }
.credits-actions button {
  background:rgba(0,0,0,.48); border:1px solid rgba(var(--pip-rgb),.42);
  color:var(--pip); border-radius:4px; padding:8px 12px; font-family:inherit; cursor:pointer;
}
@keyframes creditsRoll { 0%{transform:translate(-50%,0)} 100%{transform:translate(-50%,-230%)} }
.site-credit {
  position:fixed; right:14px; bottom:10px; z-index:5; color:rgba(var(--pip-soft-rgb),.48);
  font-size:10px; line-height:1; text-decoration:none; letter-spacing:.4px;
  text-shadow:0 0 8px rgba(0,0,0,.72); background:rgba(0,0,0,.22);
  border:1px solid rgba(var(--pip-rgb),.12); border-radius:3px; padding:3px 5px; opacity:.82;
}
.site-credit:hover { color:rgba(var(--pip-soft-rgb),.72); opacity:1 }
@media (max-width:640px) {
  body { font-size:14px; line-height:1.62 }
  body::before {
    background-image:linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,.44) 42%, rgba(0,0,0,.84)), var(--scene-bg);
    background-position:center top;
  }
  #app { height:100dvh; min-height:100dvh; padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom)) }
  #main { padding:0 10px; border-radius:6px; min-height:0 }
  header { padding:10px 0 8px; margin-bottom:8px }
  header h1 { font-size:17px; letter-spacing:3px; line-height:1.25 }
  header p { font-size:9px; letter-spacing:1px }
  .header-actions { position:static; justify-content:center; margin-top:8px }
  #end-run,#audio-toggle { min-height:36px; padding:7px 12px }
  .status-bar { flex-wrap:nowrap; overflow-x:auto; gap:10px; padding:7px 0; margin-bottom:8px; white-space:nowrap; scrollbar-width:none }
  .status-bar::-webkit-scrollbar { display:none }
  .status-bar span { flex:0 0 auto }
  #output { padding:8px 0 }
  .panel { padding:12px; margin-bottom:10px }
  .identity-grid { grid-template-columns:1fr }
  textarea { min-height:112px; font-size:16px }
  #input-area { gap:6px; padding:8px 0; padding-bottom:calc(8px + env(safe-area-inset-bottom)) }
  #input { height:44px; padding:9px 10px; font-size:16px }
  #send { height:44px; min-width:64px; padding:8px 11px; font-size:13px; letter-spacing:1px }
  .msg-image { width:100%; aspect-ratio:4/3; max-height:52dvh }
  .site-credit { right:14px; bottom:calc(78px + env(safe-area-inset-bottom)); font-size:9px; color:rgba(var(--pip-soft-rgb),.42) }
  .credits-roll { width:min(90vw,560px); top:70%; animation-duration:42s }
  .credits-roll h2 { font-size:22px; letter-spacing:4px }
  .credits-roll h3 { font-size:13px; letter-spacing:3px; margin:28px 0 10px }
  .credits-roll p { margin:7px 0; font-size:14px }
  .credits-actions {
    left:12px; right:12px; bottom:calc(14px + env(safe-area-inset-bottom));
    justify-content:center; padding:8px; border-radius:6px; background:rgba(0,0,0,.68);
    border:1px solid rgba(var(--pip-rgb),.2); backdrop-filter:blur(8px);
  }
  .credits-actions button { min-height:40px; flex:1 1 0; min-width:0; padding:8px 10px; letter-spacing:1px }
}
@media (max-width:360px) {
  #app { padding-left:6px; padding-right:6px }
  #main { padding:0 8px }
  header h1 { font-size:16px; letter-spacing:2px }
  #send { min-width:58px; padding-left:9px; padding-right:9px }
  .status-bar { font-size:11px }
  .msg { font-size:13px }
  .btn-opt { font-size:12px; padding:9px 10px }
  .credits-actions { flex-direction:column; gap:8px }
}
@media (max-height:560px) and (orientation:landscape) {
  #app { padding-top:6px; padding-bottom:6px }
  header { padding:6px 0; margin-bottom:6px }
  header h1 { font-size:15px }
  header p,.header-actions,.site-credit { display:none }
  .status-bar { padding:5px 0; margin-bottom:6px }
  #input-area { padding:6px 0 }
}
</style>
</head>
<body>
<div class="crt"></div>
<div class="scanline"></div>
<div id="app">
  <div id="main">
    <header>
      <h1>AI 文字游戏生成器</h1>
      <p>输入故事或世界观 · 自动生成可游玩的文字跑团</p>
      <div class="header-actions">
        <button id="audio-toggle" type="button" aria-pressed="false" title="开启或关闭打字音效">打字音</button>
        <button id="end-run" type="button" class="hidden">结束</button>
      </div>
    </header>
    <div class="status-bar" id="status">
      <span>📚 等待故事</span><span>🧭 生成器待机</span><span>🎭 身份未定</span>
    </div>
    <div id="output">
      <section id="setup-panel" class="panel">
        <h2>选择故事源</h2>
        <div class="preset-card active" id="preset-journey">
          <strong>西游记古文版</strong>
          <p>参考公版《西游记》原文体系，生成三界、取经、劫难、妖国、天庭与西天秩序下的互动文字游戏。</p>
          <a class="source-link" href="https://zh.wikisource.org/zh-hans/%E8%A5%BF%E6%B8%B8%E8%A8%98" target="_blank" rel="noopener noreferrer">来源：维基文库《西游记》</a>
        </div>
        <textarea id="story-input" placeholder="也可以在这里输入你的小说梗概、人物设定或原创世界观。留空则使用西游记古文版预设。"></textarea>
        <div class="toolbar">
          <button id="generate-game" class="primary" type="button">生成文字游戏</button>
          <span id="generate-hint" class="muted">先生成世界蓝图，再选择身份开局。</span>
        </div>
      </section>
      <section id="identity-panel" class="panel hidden">
        <h2>选择你的开局身份</h2>
        <div id="blueprint-summary"></div>
        <div id="identity-list" class="identity-grid"></div>
        <input id="custom-identity" type="text" placeholder="或输入自定义身份，例如：被贬下凡的天庭小吏">
        <div class="toolbar">
          <button id="start-game" class="primary" type="button">以此身份开局</button>
          <button id="regenerate-game" class="ghost" type="button">重新生成</button>
        </div>
      </section>
    </div>
    <div id="opts-area" style="display:none"></div>
    <div id="input-area" class="hidden">
      <input id="input" type="text" placeholder="> 输入你的行动...">
      <button id="send" type="button">发 送</button>
    </div>
  </div>
</div>
<a class="site-credit" href="https://github.com/3105138391-sketch" target="_blank" rel="noopener noreferrer">© 3105138391-sketch</a>
<div id="credits-overlay" class="credits-overlay" aria-hidden="true">
  <div id="credits-roll" class="credits-roll"></div>
  <div class="credits-actions">
    <button id="continue-run" type="button">继续游玩</button>
    <button id="restart-run" type="button">重新开始</button>
  </div>
</div>

<script>
const CHAT_URL = '/api/chat';
const IMAGE_URL = '/api/image';
const GENERATE_URL = '/api/generate-game';
const START_URL = '/api/start-game';

const JOURNEY_SOURCE = `《西游记》古文版世界观摘要：
- 世界结构：三界、四大部洲、天庭、西天、地府、龙宫、洞府妖国、人间国度。
- 核心主题：取经、修心、劫难、神魔秩序、佛道体系、因果试炼。
- 关键角色可作为 NPC 或势力出现：唐僧、孙悟空、猪八戒、沙僧、观音、玉帝、龙王、阎君、妖王。
- 叙事应贴近章回体神魔小说气质，但文字游戏回复要现代可读、可操作。
来源：https://zh.wikisource.org/zh-hans/西游記`;

let audioCtx = null;
let typeGain = null;
let audioEnabled = false;
let typeSoundCounter = 0;
let currentBlueprint = null;
let selectedIdentity = '';
let history = [];
let typingTimer = null;
let gameEnded = false;
let generatedScenes = [];
let currentSceneId = '';
const gameProgress = {
  turns: 0,
  main: new Set(),
  side: new Set(),
  locations: new Set(),
  scenes: new Set(),
  actions: []
};

function initAudio() {
  if (audioCtx) return;
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;
  audioCtx = new AudioContextClass();
  typeGain = audioCtx.createGain();
  typeGain.gain.value = 0.08;
  typeGain.connect(audioCtx.destination);
}

async function resumeAudio() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
}

function playTone(freq, start, duration) {
  if (!audioCtx || !typeGain) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(0.055, start + 0.002);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  osc.connect(gain);
  gain.connect(typeGain);
  osc.start(start);
  osc.stop(start + duration + 0.02);
}

async function toggleAudio() {
  audioEnabled = !audioEnabled;
  const btn = document.getElementById('audio-toggle');
  if (audioEnabled) {
    btn.classList.add('active');
    btn.textContent = '静音';
    btn.setAttribute('aria-pressed', 'true');
    await resumeAudio();
  } else {
    btn.classList.remove('active');
    btn.textContent = '打字音';
    btn.setAttribute('aria-pressed', 'false');
  }
}

function playTypingSound(char) {
  if (!audioEnabled || !audioCtx || !typeGain || !char.trim()) return;
  typeSoundCounter += 1;
  if (typeSoundCounter % 2 !== 0) return;
  playTone(860 + Math.random() * 260, audioCtx.currentTime, 0.018);
}

function updateStatus(text) {
  const status = document.getElementById('status');
  status.innerHTML = '';
  const parts = String(text || '').replace(/[|｜]/g, '|').split('|').filter(Boolean);
  parts.slice(0, 6).forEach(part => {
    const span = document.createElement('span');
    span.textContent = part.trim();
    status.appendChild(span);
  });
}

function setBusy(isBusy, text = '生成中') {
  const btn = document.getElementById('generate-game');
  btn.disabled = isBusy;
  document.getElementById('generate-hint').innerHTML = isBusy ? `<span class="loading">▌</span> ${text}` : '先生成世界蓝图，再选择身份开局。';
}

async function postJSON(url, payload) {
  const resp = await fetch(url, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify(payload)
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.message || data.error?.message || '请求失败');
  return data;
}

function escapeHTML(text) {
  return String(text ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function asArray(value) {
  return Array.isArray(value) ? value : [];
}

function summarizeBlueprint(blueprint) {
  const factions = asArray(blueprint.factions).slice(0, 4).map(item => escapeHTML(item.name || item)).join(' / ');
  const locations = asArray(blueprint.locations).slice(0, 5).map(item => escapeHTML(item.name || item)).join(' / ');
  return `
    <p><strong>${escapeHTML(blueprint.title || '未命名文字游戏')}</strong></p>
    <p>${escapeHTML(blueprint.worldSummary || '')}</p>
    <p class="muted">势力：${factions || '待生成'}<br>地点：${locations || '待生成'}</p>
  `;
}

function renderIdentityOptions(identities) {
  const list = document.getElementById('identity-list');
  list.innerHTML = '';
  asArray(identities).slice(0, 5).forEach((identity, index) => {
    const name = identity.name || identity;
    const desc = identity.description || '';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'identity-btn';
    btn.innerHTML = `${escapeHTML(name)}${desc ? `<small>${escapeHTML(desc)}</small>` : ''}`;
    btn.addEventListener('click', () => {
      selectedIdentity = name;
      document.getElementById('custom-identity').value = name;
      document.querySelectorAll('.identity-btn').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
    });
    if (index === 0) {
      selectedIdentity = name;
      document.getElementById('custom-identity').value = name;
      btn.classList.add('active');
    }
    list.appendChild(btn);
  });
}

async function generateGame() {
  setBusy(true, '正在分析故事、扩写世界观、生成游戏蓝图...');
  updateStatus('📚 故事分析中 | 🧭 蓝图生成中 | 🎭 身份待推荐');
  const customText = document.getElementById('story-input').value.trim();
  const sourceText = customText || JOURNEY_SOURCE;
  try {
    const data = await postJSON(GENERATE_URL, {
      presetId:'journey-west-classic',
      sourceTitle:customText ? '自定义故事/世界观' : '西游记古文版',
      sourceText
    });
    currentBlueprint = data.blueprint;
    selectedIdentity = '';
    document.getElementById('setup-panel').classList.add('hidden');
    document.getElementById('identity-panel').classList.remove('hidden');
    document.getElementById('blueprint-summary').innerHTML = summarizeBlueprint(currentBlueprint);
    renderIdentityOptions(currentBlueprint.identitySuggestions);
    updateStatus(`📚 ${currentBlueprint.title || '已生成'} | 🧭 等待身份 | 🎭 可开局`);
    prepareSceneImages(currentBlueprint);
  } catch (error) {
    console.error(error);
    setSystemMessage(`生成失败：${error.message}`);
    updateStatus('📚 生成失败 | 🧭 请检查 API Key | 🎭 未开局');
  } finally {
    setBusy(false);
  }
}

function resetToSetup() {
  currentBlueprint = null;
  selectedIdentity = '';
  generatedScenes = [];
  currentSceneId = '';
  document.getElementById('identity-panel').classList.add('hidden');
  document.getElementById('setup-panel').classList.remove('hidden');
  updateStatus('📚 等待故事 | 🧭 生成器待机 | 🎭 身份未定');
}

async function prepareSceneImages(blueprint) {
  generatedScenes = asArray(blueprint.scenes).slice(0, 4).map((scene, index) => ({
    id: `scene-${index}`,
    label: scene.label || `场景${index + 1}`,
    prompt: scene.prompt || scene.description || blueprint.visualStyle || blueprint.title,
    keywords: asArray(scene.keywords).concat(scene.label || ''),
    imageUrl: null
  }));
  generatedScenes.forEach(async scene => {
    try {
      const data = await postJSON(IMAGE_URL, { scene: scene.prompt });
      scene.imageUrl = data.url || null;
      if (scene.imageUrl && (!currentSceneId || scene.id === generatedScenes[0]?.id)) setSceneBackground(scene);
    } catch (error) {
      console.warn('背景图生成失败:', error);
    }
  });
}

function hasAnyKeyword(text, keywords) {
  return asArray(keywords).some(keyword => keyword && text.includes(keyword));
}

function chooseScene(reply) {
  const text = getRoutingText(reply);
  return generatedScenes.find(scene => hasAnyKeyword(text, scene.keywords)) || generatedScenes.find(scene => scene.id === currentSceneId) || generatedScenes[0];
}

function setSceneBackground(scene) {
  if (!scene) return;
  gameProgress.scenes.add(scene.label);
  if (scene.id === currentSceneId && scene.imageUrl) return;
  currentSceneId = scene.id;
  document.body.dataset.scene = scene.id;
  if (scene.imageUrl) document.documentElement.style.setProperty('--scene-bg', `url("${scene.imageUrl}")`);
}

function getRoutingText(reply) {
  const lines = reply.split('\n').map(line => line.trim()).filter(Boolean);
  const statusLine = lines.find(line => line.includes('📍') || line.includes('地点'));
  return statusLine || reply.slice(0, 260);
}

function recordProgress(reply) {
  gameProgress.turns += 1;
  const routingText = getRoutingText(reply);
  const statusMatch = reply.match(/(?:📍|地点[:：])\s*([^|\n]+)/);
  if (statusMatch) gameProgress.locations.add(statusMatch[1].trim());
  asArray(currentBlueprint?.mainQuests).forEach((quest, index) => {
    if (hasAnyKeyword(reply + routingText, asArray(quest.keywords).concat(quest.title || quest))) gameProgress.main.add(index);
  });
  asArray(currentBlueprint?.sideQuests).forEach((quest, index) => {
    if (hasAnyKeyword(reply + routingText, asArray(quest.keywords).concat(quest.title || quest))) gameProgress.side.add(index);
  });
  setSceneBackground(chooseScene(reply));
}

function stopTyping() {
  if (typingTimer) clearTimeout(typingTimer);
  typingTimer = null;
}

function flushAll() {
  stopTyping();
  document.querySelectorAll('.msg.gm span:not(.done)').forEach(span => {
    const parent = span.closest('.msg.gm');
    if (parent?._fullText) {
      span.textContent = parent._fullText;
      span.classList.add('done');
      if (parent._finishTyping) parent._finishTyping();
    }
  });
}

function typeText(text, container, speed = 28, onDone) {
  let i = 0;
  const chars = [...text];
  const span = document.createElement('span');
  container._typingDone = false;
  container.appendChild(span);
  container._finishTyping = () => {
    if (container._typingDone) return;
    container._typingDone = true;
    typingTimer = null;
    span.classList.add('done');
    if (onDone) onDone();
  };
  function tick() {
    if (i < chars.length) {
      span.textContent += chars[i];
      playTypingSound(chars[i]);
      i++;
      const out = document.getElementById('output');
      out.scrollTop = out.scrollHeight;
      typingTimer = setTimeout(tick, speed);
    } else {
      container._finishTyping();
    }
  }
  tick();
}

function setSystemMessage(text) {
  const out = document.getElementById('output');
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function getOptions(reply) {
  const opts = [];
  reply.split('\n').forEach(line => {
    const match = line.match(/^[A-D][.、．]\s*(.+)/);
    if (match) opts.push(match[1].trim());
  });
  return opts;
}

function updateStatusFromReply(reply) {
  const statusMatch = reply.match(/📍[^\n]+/);
  if (statusMatch) updateStatus(statusMatch[0]);
}

function setImagePlaceholder(slot, text) {
  slot.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'placeholder';
  div.textContent = text;
  slot.appendChild(div);
}

function attachImage(slot, imagePromise) {
  setImagePlaceholder(slot, '正在生成场景图...');
  imagePromise.then(url => {
    if (!url) {
      setImagePlaceholder(slot, '场景图生成失败，文字游戏可继续');
      return;
    }
    slot.innerHTML = '';
    const img = document.createElement('img');
    img.alt = '场景图';
    img.loading = 'lazy';
    img.onerror = () => setImagePlaceholder(slot, '图片加载失败');
    img.src = url;
    slot.appendChild(img);
  }).catch(() => setImagePlaceholder(slot, '场景图生成失败，文字游戏可继续'));
}

function extractScene(reply) {
  const scene = reply.slice(0, 180).replace(/[⚔📍📌❤️💎⚡✨🔷◆◇🐾]/g, '').replace(/[「」\n]/g, ' ').trim();
  return scene || currentBlueprint?.visualStyle || '高质量文字冒险场景背景，暗色奇幻，电影感';
}

function renderAssistantMessage(reply, imagePromise, speed = 28) {
  const out = document.getElementById('output');
  const gmDiv = document.createElement('div');
  gmDiv.className = 'msg gm';
  gmDiv._fullText = reply;
  out.appendChild(gmDiv);
  recordProgress(reply);
  const imageSlot = document.createElement('div');
  imageSlot.className = 'msg-image';
  let imageAttached = false;
  const revealInlineImage = () => {
    if (imageAttached) return;
    imageAttached = true;
    gmDiv.appendChild(imageSlot);
    attachImage(imageSlot, imagePromise || postJSON(IMAGE_URL, { scene: extractScene(reply) }).then(data => data.url));
    out.scrollTop = out.scrollHeight;
  };
  typeText(reply, gmDiv, speed, () => {
    revealInlineImage();
    afterMessage(reply);
  });
  updateStatusFromReply(reply);
  out.scrollTop = out.scrollHeight;
}

function showOptions(reply) {
  const optsArea = document.getElementById('opts-area');
  const opts = getOptions(reply);
  optsArea.innerHTML = '';
  if (!opts.length) {
    optsArea.style.display = 'none';
    return;
  }
  optsArea.style.display = 'flex';
  opts.slice(0, 4).forEach((opt, index) => {
    const btn = document.createElement('button');
    btn.className = 'btn-opt';
    btn.textContent = `${String.fromCharCode(65 + index)}. ${opt}`;
    btn.addEventListener('click', () => send(opt));
    optsArea.appendChild(btn);
  });
}

function afterMessage(reply) {
  showOptions(reply);
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  input.disabled = false;
  sendBtn.disabled = false;
  input.focus();
}

async function callChat(messages, options = {}) {
  const data = await postJSON(CHAT_URL, {
    model: options.model || 'deepseek-chat',
    messages,
    temperature: options.temperature ?? .85,
    max_tokens: options.max_tokens ?? 1500
  });
  const content = data.choices?.[0]?.message?.content;
  if (!content) throw new Error('AI 响应格式异常');
  return content.trim();
}

async function startGame() {
  if (!currentBlueprint) return;
  const custom = document.getElementById('custom-identity').value.trim();
  selectedIdentity = custom || selectedIdentity || asArray(currentBlueprint.identitySuggestions)[0]?.name || '无名旅人';
  document.getElementById('identity-panel').classList.add('hidden');
  document.getElementById('setup-panel').classList.add('hidden');
  document.getElementById('input-area').classList.remove('hidden');
  document.getElementById('end-run').classList.remove('hidden');
  document.getElementById('output').innerHTML = '';
  updateStatus(`📚 ${currentBlueprint.title || '文字游戏'} | 🧭 开局生成中 | 🎭 ${selectedIdentity}`);
  try {
    const data = await postJSON(START_URL, { blueprint: currentBlueprint, identity: selectedIdentity });
    const intro = data.opening;
    history = [{ role:'system', content: currentBlueprint.gmPrompt }, { role:'assistant', content:intro }];
    renderAssistantMessage(intro, postJSON(IMAGE_URL, { scene: extractScene(intro) }).then(data => data.url), 25);
  } catch (error) {
    console.error(error);
    setSystemMessage(`开局失败：${error.message}`);
  }
}

async function send(msg) {
  const cleanMsg = String(msg || '').trim();
  if (!cleanMsg || gameEnded || !currentBlueprint) return;
  if (['结束','退出','谢幕','end','END'].includes(cleanMsg)) {
    showEndingCredits();
    return;
  }
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  input.disabled = true;
  sendBtn.disabled = true;
  document.getElementById('opts-area').style.display = 'none';

  const out = document.getElementById('output');
  const playerDiv = document.createElement('div');
  playerDiv.className = 'msg player';
  playerDiv.textContent = cleanMsg;
  out.appendChild(playerDiv);
  out.scrollTop = out.scrollHeight;

  gameProgress.actions.push(cleanMsg);
  if (gameProgress.actions.length > 20) gameProgress.actions.shift();
  history.push({ role:'user', content:cleanMsg });
  if (history.length > 30) history.splice(1, history.length - 28);

  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'msg gm';
  loadingDiv.innerHTML = '<span class="loading">▌</span>';
  out.appendChild(loadingDiv);
  out.scrollTop = out.scrollHeight;

  try {
    const reply = await callChat(history, { temperature:.85, max_tokens:1500 });
    loadingDiv.remove();
    history.push({ role:'assistant', content:reply });
    renderAssistantMessage(reply, postJSON(IMAGE_URL, { scene: extractScene(reply) }).then(data => data.url), 28);
  } catch (error) {
    loadingDiv.remove();
    setSystemMessage(`连接中断：${error.message}`);
    input.disabled = false;
    sendBtn.disabled = false;
  }
  input.value = '';
}

function labelsFrom(items, selectedSet) {
  return asArray(items).filter((_, index) => selectedSet.has(index)).map(item => item.title || item.name || item);
}

function missingLabelsFrom(items, selectedSet) {
  return asArray(items).filter((_, index) => !selectedSet.has(index)).map(item => item.title || item.name || item);
}

function renderCreditLines(items, emptyText) {
  if (!items.length) return `<p class="muted">${escapeHTML(emptyText)}</p>`;
  return items.map(item => `<p>${escapeHTML(item)}</p>`).join('');
}

function buildEndingCredits() {
  const mainUnlocked = labelsFrom(currentBlueprint?.mainQuests, gameProgress.main);
  const sideUnlocked = labelsFrom(currentBlueprint?.sideQuests, gameProgress.side);
  const mainLocked = missingLabelsFrom(currentBlueprint?.mainQuests, gameProgress.main);
  const sideLocked = missingLabelsFrom(currentBlueprint?.sideQuests, gameProgress.side);
  const locations = [...gameProgress.locations].slice(-10);
  const scenes = [...gameProgress.scenes];
  const actions = gameProgress.actions.slice(-8).map(action => `> ${action}`);
  return `
    <h2>${escapeHTML(currentBlueprint?.title || '文字游戏')} · 本次谢幕</h2>
    <p>身份：${escapeHTML(selectedIdentity || '未记录')}</p>
    <p class="big-stat">主线 ${mainUnlocked.length}/${asArray(currentBlueprint?.mainQuests).length} · 支线 ${sideUnlocked.length}/${asArray(currentBlueprint?.sideQuests).length}</p>
    <h3>你已走过的主线</h3>
    ${renderCreditLines(mainUnlocked, '尚未推进主线节点')}
    <h3>你触碰的支线</h3>
    ${renderCreditLines(sideUnlocked, '尚未触发支线')}
    <h3>仍未解锁</h3>
    ${renderCreditLines([...mainLocked, ...sideLocked], '全部记录项目均已解锁')}
    <h3>到访地点</h3>
    ${renderCreditLines(locations, '地点记录为空')}
    <h3>生成场景</h3>
    ${renderCreditLines(scenes, '场景记录为空')}
    <h3>最后行动</h3>
    ${renderCreditLines(actions, '行动记录为空')}
    <p class="muted">故事仍可继续。你可以返回游玩，或重新生成另一段世界。</p>
  `;
}

function showEndingCredits() {
  flushAll();
  gameEnded = true;
  const overlay = document.getElementById('credits-overlay');
  document.getElementById('credits-roll').innerHTML = buildEndingCredits();
  overlay.classList.add('active');
  overlay.setAttribute('aria-hidden', 'false');
}

function hideEndingCredits() {
  gameEnded = false;
  const overlay = document.getElementById('credits-overlay');
  overlay.classList.remove('active');
  overlay.setAttribute('aria-hidden', 'true');
}

document.getElementById('preset-journey').addEventListener('click', () => {
  document.getElementById('preset-journey').classList.add('active');
});
document.getElementById('generate-game').addEventListener('click', generateGame);
document.getElementById('regenerate-game').addEventListener('click', resetToSetup);
document.getElementById('start-game').addEventListener('click', startGame);
document.getElementById('audio-toggle').addEventListener('click', () => toggleAudio().catch(console.warn));
document.getElementById('end-run').addEventListener('click', showEndingCredits);
document.getElementById('continue-run').addEventListener('click', hideEndingCredits);
document.getElementById('restart-run').addEventListener('click', () => window.location.reload());
document.getElementById('output').addEventListener('click', () => { if (typingTimer) flushAll(); });
document.getElementById('send').addEventListener('click', () => send(document.getElementById('input').value));
document.getElementById('input').addEventListener('keydown', event => {
  if (event.key === 'Enter') send(document.getElementById('input').value);
});
document.getElementById('custom-identity').addEventListener('input', event => {
  selectedIdentity = event.target.value.trim();
});
</script>
